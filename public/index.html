<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sight Reading Helper</title>
<style>
:root{--bg:#eef1f5;--fg:#14213d;--mut:#5d6b82;--card:#fff;--line:#cdd5e1;--acc:#14213d;--on:#fff;--ok:#1c9c5b;--bad:#e4572e;--zone:rgba(28,156,91,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--fg:#e8edf6;--mut:#8b9ab3;--card:#162032;--line:#2a3750;--acc:#e8edf6;--on:#0e1522;--ok:#3fcf7a;--bad:#ff7a52;--zone:rgba(63,207,122,.14)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:1400px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:Georgia,serif;font-weight:700;margin:0 0 12px}
h1{font-size:28px}h2{font-size:22px}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc)}
button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
button:focus-visible,input:focus-visible{outline:2px solid var(--bad);outline-offset:2px}
input[type=text],input[type=password]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-height:40px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.me .lb{font-weight:700}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
.meter{position:relative;height:56px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin:12px 0;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:calc(50% - 20%);width:40%;background:color-mix(in srgb,var(--ok) 22%,transparent)}
.meter .mid{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line)}
.meter .needle{position:absolute;top:6px;bottom:6px;width:6px;margin-left:-3px;border-radius:3px;background:var(--mut);left:50%;transition:left .08s linear}
.big{display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:34px}
.err{color:var(--bad)}
main.narrow{max-width:640px}
#bar{-moz-appearance:textfield;appearance:textfield}
#bar::-webkit-inner-spin-button,#bar::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;font:inherit;color:inherit;resize:vertical}
.bar input[type=text]{min-width:0;width:auto}
.pick{position:relative;flex:1;min-width:0}
.pick input{font-weight:700}
.plist{position:absolute;left:0;right:0;top:100%;z-index:20;max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:4px}
.plist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.plist button.act{background:var(--zone)}
.split{display:grid;gap:12px}
@media(min-width:1000px){.split{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.live{min-width:0}.tlwrap{min-width:0}
#lv{border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:default}
.card{margin:12px 0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
#res:empty{display:none}
.ls{display:flex;gap:10px;width:100%;text-align:left;margin-top:6px;align-items:baseline;flex-wrap:wrap}
.ls .dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}
.hide{display:none}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:inherit;min-height:32px}
.tl{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.gut{flex:0 0 190px;border-right:1px solid var(--line)}
.gut .sp{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;border-bottom:1px solid var(--line)}
.gut .sp button{min-height:20px;padding:0 7px;font-size:12px;line-height:1}
.trow{padding:5px 6px;border-bottom:1px solid var(--line);overflow:hidden}
.trow.me{background:var(--zone)}
.trow .lb{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:4px;align-items:center;margin-top:5px}
.ctl button{min-height:28px;padding:0 7px;font-size:12px}
button.sol{background:#ffb703;color:#14213d;border-color:#ffb703}
.ctl button.dim{opacity:.4}
.ctl label{font-size:12px;white-space:nowrap}
.ctl select{min-width:0;flex:1;font-size:12px;min-height:28px}
.cvw{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:6px}
.top .lb{flex:1;min-width:0}
.vol{flex:0 0 68px;width:68px;min-height:20px;margin:0}
canvas{display:block;width:100%;touch-action:none;cursor:pointer}
.up{display:flex;flex-direction:column;gap:2px}
.up button{min-height:20px;padding:0 8px;line-height:1}
:root{--rec:#e5192b}
@media(prefers-color-scheme:dark){:root{--rec:#ff4d5e}}
.pickw{display:flex;align-items:center;gap:8px;flex:1 1 360px;min-width:0}
.ib{display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:1.5px solid var(--mut);background:none;color:var(--mut);font:italic 700 14px/1 Georgia,serif;vertical-align:middle;cursor:pointer}
.ib:hover,.ib[aria-expanded=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
h1 .ib{margin-left:10px;position:relative;top:-3px}
.tipbox{position:fixed;z-index:100;left:0;top:0;width:max-content;max-width:min(380px,calc(100vw - 16px));max-height:min(60vh,420px);overflow:auto;padding:10px 12px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);font:14px/1.45 system-ui,sans-serif}
.tipbox[hidden]{display:none}
.tipbox div+div{margin-top:6px}
.tipbox .info{white-space:pre-line}
.tipbox a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);margin-right:7px;vertical-align:middle;animation:rp 1.6s infinite}
@keyframes rp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
@media(prefers-reduced-motion:reduce){.rdot{animation:none}}
.lvrow{display:flex;align-items:stretch}
.lvrow #lv{flex:1 1 0;min-width:0;width:auto;border-radius:0 8px 8px 0}
#kb{flex:0 0 58px;width:58px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;touch-action:none}
.bar .pick input[type=text]{width:100%;text-overflow:ellipsis}
.hc,.hb{fill:var(--card);stroke:var(--line)}
.ht{font:12px system-ui,sans-serif;fill:var(--fg)}.ht.s{font-size:11px}.ht.m{fill:var(--mut)}
.hl{fill:none;stroke:#ffb703;stroke-width:2.5}
.ov{position:fixed;inset:0;z-index:200;display:flex;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto;background:rgba(10,16,28,.55)}
.hp{position:relative;margin:auto;width:100%;max-width:660px;padding:20px 20px 4px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.hp h2{margin-bottom:16px;padding-right:36px}
.hp .x{position:absolute;top:12px;right:12px;width:32px;min-height:32px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.hs{list-style:none;margin:0;padding:0;counter-reset:s}
.hs li{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px;align-items:center;padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line);counter-increment:s}
.hs li:last-child{border-bottom:0;margin-bottom:0}
.hs svg{display:block;width:100%;height:auto}
.hs b{display:block;margin-bottom:2px;font-family:Georgia,serif;font-size:17px}
.hs b::before{content:counter(s) '. ';color:var(--mut)}
.hs span{display:block;color:var(--mut);font-size:14px}
@media(max-width:560px){.hs li{grid-template-columns:1fr;gap:10px}}
.bar.mix{gap:10px 32px}
.mix label,.grp{display:inline-flex;align-items:center;gap:8px}
.mix input[type=range]{margin:0}
#tv{display:inline-block;min-width:4ch;text-align:right}
#setb{display:inline-flex;align-items:center;justify-content:center;width:40px;padding:0}
.sg{padding:14px 0;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg select{display:block;margin:6px 0}

function editor() {
  app.innerHTML = `<h2>${tt(ed.id ? 'editPiece' : 'newPiece')}</h2>
    <input type="text" id="ti" value="${esc(ed.title)}" aria-label="${esc(tt('title'))}" placeholder="${esc(tt('title'))}">
    <div class="bar"><input type="text" id="co" value="${esc(ed.composer)}" placeholder="${esc(tt('composer'))}" aria-label="${esc(tt('composer'))}" style="flex:2"><input type="text" id="dt" value="${esc(ed.date)}" placeholder="${esc(tt('date'))}" aria-label="${esc(tt('date'))}" style="flex:1"></div>
    <textarea id="inf" rows="2" placeholder="${esc(tt('otherPh'))}" aria-label="${esc(tt('otherAria'))}">${esc(ed.info)}</textarea>
    <div>${ed.rows.map((r, i) => `<div class="row">
      <div class="up"><button data-u="${i}" aria-label="${esc(tt('up'))}">▲</button><button data-w="${i}" aria-label="${esc(tt('down'))}">▼</button></div>
      <div class="lb"><input type="text" data-l="${i}" value="${esc(r.label)}" aria-label="${esc(tt('label'))}"><span class="mut">${esc(r.orig)} · ${tt('notesN', { n: r.n })}</span></div>
      <select data-n="${i}" aria-label="${esc(tt('defInst'))}">${Object.keys(INST).map(k => `<option value="${k}" ${r.inst === k ? 'selected' : ''}>${tt('i_' + k)}</option>`).join('')}</select><label class="mut"><input type="checkbox" data-h="${i}" ${r.hidden ? 'checked' : ''}> ${tt('hide')}</label></div>`).join('')}</div>
    <div class="bar"><button id="sv" class="p">${tt('save')}</button><button id="cn">${tt('cancel')}</button></div><div id="e" class="err"></div>`;
  const sync = () => { ed.title = $('#ti').value; ed.composer = $('#co').value; ed.date = $('#dt').value; ed.info = $('#inf').value; app.querySelectorAll('[data-l]').forEach(i => ed.rows[i.dataset.l].label = i.value); app.querySelectorAll('[data-h]').forEach(i => ed.rows[i.dataset.h].hidden = i.checked); app.querySelectorAll('[data-n]').forEach(i => ed.rows[i.dataset.n].inst = i.value); };
  const mv = (i, j) => { sync(); if (j < 0 || j >= ed.rows.length) return; [ed.rows[i], ed.rows[j]] = [ed.rows[j], ed.rows[i]]; editor(); };
  app.querySelectorAll('[data-u]').forEach(b => b.onclick = () => mv(+b.dataset.u, +b.dataset.u - 1));
  app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => mv(+b.dataset.w, +b.dataset.w + 1));
  $('#cn').onclick = adminView;
  $('#sv').onclick = async () => {
    sync();
    const tr = ed.rows.map(r => ({ key: r.key, label: r.label.trim() || r.orig, hidden: r.hidden, instrument: r.inst }));
    try {
      if (ed.id) await api('/pieces/' + ed.id, { method: 'PUT', body: JSON.stringify({ title: ed.title, composer: ed.composer, date: ed.date, info: ed.info, tracks: tr }) });
      else await api('/pieces', { method: 'POST', body: JSON.stringify({ title: ed.title, composer: ed.composer, date: ed.date, info: ed.info, tracks: tr, midi: ed.b64 }) });
      adminView();
    } catch (e) { $('#e').textContent = e.message; }
  };
}

/* ---------- router ---------- */
const route = () => {
  loopId++; closeHelp();
  if (location.hash === '#admin') return adminView();
  const m = /^#piece\/([0-9a-f]+)$/i.exec(location.hash);
  if (m) { stop(); return openPiece(m[1]); }
  return listView();
};
addEventListener('hashchange', route); route();
</script></body></html>
