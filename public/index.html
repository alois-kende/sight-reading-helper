<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Déchiffrage</title>
<style>
:root{--bg:#eef1f5;--fg:#14213d;--mut:#5d6b82;--card:#fff;--line:#cdd5e1;--acc:#14213d;--on:#fff;--ok:#1c9c5b;--bad:#e4572e;--zone:rgba(28,156,91,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--fg:#e8edf6;--mut:#8b9ab3;--card:#162032;--line:#2a3750;--acc:#e8edf6;--on:#0e1522;--ok:#3fcf7a;--bad:#ff7a52;--zone:rgba(63,207,122,.14)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:1400px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:Georgia,serif;font-weight:700;margin:0 0 12px}
h1{font-size:28px}h2{font-size:22px}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc)}
button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
button:focus-visible,input:focus-visible{outline:2px solid var(--bad);outline-offset:2px}
input[type=text],input[type=password]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-height:40px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.me .lb{font-weight:700}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
.meter{position:relative;height:56px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin:12px 0;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:calc(50% - 20%);width:40%;background:color-mix(in srgb,var(--ok) 22%,transparent)}
.meter .mid{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line)}
.meter .needle{position:absolute;top:6px;bottom:6px;width:6px;margin-left:-3px;border-radius:3px;background:var(--mut);left:50%;transition:left .08s linear}
.big{display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:34px}
.err{color:var(--bad)}
main.narrow{max-width:640px}
#bar{-moz-appearance:textfield;appearance:textfield}
#bar::-webkit-inner-spin-button,#bar::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;font:inherit;color:inherit;resize:vertical}
.bar input[type=text]{min-width:0;width:auto}
.pick{position:relative;flex:1;min-width:0}
.pick input{font-weight:700}
.plist{position:absolute;left:0;right:0;top:100%;z-index:20;max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:4px}
.plist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.plist button.act{background:var(--zone)}
.split{display:grid;gap:12px}
@media(min-width:1000px){.split{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.live{min-width:0}.tlwrap{min-width:0}
#lv{border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:default}
.card{margin:12px 0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
#res:empty{display:none}
.score .num{font:700 56px/1 Georgia,serif}
.ls{display:flex;gap:10px;width:100%;text-align:left;margin-top:6px;align-items:baseline;flex-wrap:wrap}
.ls span:nth-of-type(1){color:var(--bad);min-width:48px}
.hide{display:none}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:inherit;min-height:32px}
.tl{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.gut{flex:0 0 190px;border-right:1px solid var(--line)}
.gut .sp{border-bottom:1px solid var(--line)}
.trow{padding:5px 6px;border-bottom:1px solid var(--line);overflow:hidden}
.trow.me{background:var(--zone)}
.trow .lb{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:4px;align-items:center;margin-top:5px}
.ctl button{min-height:28px;padding:0 7px;font-size:12px}
button.sol{background:#ffb703;color:#14213d;border-color:#ffb703}
.ctl button.dim{opacity:.4}
.ctl label{font-size:12px;white-space:nowrap}
.ctl select{min-width:0;flex:1;font-size:12px;min-height:28px}
.cvw{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:6px}
.top .lb{flex:1;min-width:0}
.vol{flex:0 0 68px;width:68px;min-height:20px;margin:0}
canvas{display:block;width:100%;touch-action:none;cursor:pointer}
.up{display:flex;flex-direction:column;gap:2px}
.up button{min-height:20px;padding:0 8px;line-height:1}
:root{--rec:#e5192b}
@media(prefers-color-scheme:dark){:root{--rec:#ff4d5e}}
.pickw{display:flex;align-items:center;gap:8px;flex:1 1 360px;min-width:0}
.ib{display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:1.5px solid var(--mut);background:none;color:var(--mut);font:italic 700 14px/1 Georgia,serif;vertical-align:middle;cursor:pointer}
.ib:hover,.ib[aria-expanded=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
h1 .ib{margin-left:10px;position:relative;top:-3px}
.tipbox{position:fixed;z-index:100;left:0;top:0;width:max-content;max-width:min(380px,calc(100vw - 16px));max-height:min(60vh,420px);overflow:auto;padding:10px 12px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);font:14px/1.45 system-ui,sans-serif}
.tipbox[hidden]{display:none}
.tipbox div+div{margin-top:6px}
.tipbox .info{white-space:pre-line}
.tipbox a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);margin-right:7px;vertical-align:middle;animation:rp 1.6s infinite}
@keyframes rp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
@media(prefers-reduced-motion:reduce){.rdot{animation:none}}
.lvrow{display:flex;align-items:stretch}
.lvrow #lv{flex:1 1 0;min-width:0;width:auto;border-radius:0 8px 8px 0}
#kb{flex:0 0 58px;width:58px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;touch-action:none}
.bar .pick input[type=text]{width:100%;text-overflow:ellipsis}
</style></head><body><main id="app"></main>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let admin = sessionStorage.getItem('adm') || '';
const api = async (p, o = {}) => {
  const r = await fetch('/api' + p, { ...o, headers: { 'Content-Type': 'application/json', 'X-Admin': admin } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

const APP_VERSION = '__APP_VERSION__';
const APP_REPO = 'https://github.com/alois-kende/sight-reading-helper';

/* ---------- info bubbles: hover shows, click locks until click elsewhere / scroll ---------- */
const tipBtn = (html, label) => `<button type="button" class="ib" aria-label="${esc(label)}" aria-haspopup="true" aria-expanded="false">i</button><span class="tipsrc" hidden>${html}</span>`;
const tipBox = document.createElement('div');
tipBox.className = 'tipbox'; tipBox.setAttribute('role', 'tooltip'); tipBox.hidden = true; document.body.appendChild(tipBox);
let tipFor = null, tipLocked = false, tipTimer = 0;
function tipPlace(b) {
  const r = b.getBoundingClientRect(), pad = 8, vw = document.documentElement.clientWidth, vh = innerHeight;
  tipBox.style.left = '0px'; tipBox.style.top = '0px';
  const w = tipBox.offsetWidth, h = tipBox.offsetHeight;
  const x = Math.max(pad, Math.min(r.left, vw - w - pad));
  let y = r.bottom + 6; if (y + h > vh - pad && r.top - 6 - h >= pad) y = r.top - 6 - h;
  tipBox.style.left = x + 'px'; tipBox.style.top = y + 'px';
}
function tipHide() {
  clearTimeout(tipTimer); tipBox.hidden = true;
  if (tipFor) tipFor.setAttribute('aria-expanded', 'false');
  tipFor = null; tipLocked = false;
}
function tipShow(b) {
  clearTimeout(tipTimer);
  const src = b.nextElementSibling; if (!src || !b.isConnected) return;
  if (tipFor && tipFor !== b) tipFor.setAttribute('aria-expanded', 'false');
  if (tipFor !== b) { tipBox.innerHTML = src.innerHTML; tipFor = b; }
  tipBox.hidden = false; b.setAttribute('aria-expanded', 'true'); tipPlace(b);
}
const tipBtnOf = e => e.target.closest ? e.target.closest('.ib') : null;
document.addEventListener('mouseover', e => {
  if (tipLocked) return;
  const b = tipBtnOf(e);
  if (b) tipShow(b); else if (tipBox.contains(e.target)) clearTimeout(tipTimer);
});
document.addEventListener('mouseout', e => {
  if (tipLocked || !(tipBtnOf(e) || tipBox.contains(e.target))) return;
  const to = e.relatedTarget;
  if (to && (tipBox.contains(to) || (tipFor && tipFor.contains(to)))) return;
  clearTimeout(tipTimer); tipTimer = setTimeout(tipHide, 150);
});
document.addEventListener('focusin', e => { const b = tipBtnOf(e); if (b && !tipLocked) tipShow(b); });
document.addEventListener('focusout', e => { if (!tipLocked && tipBtnOf(e)) tipHide(); });
document.addEventListener('click', e => {
  const b = tipBtnOf(e);
  if (b) { e.preventDefault(); if (tipLocked && tipFor === b) tipHide(); else { tipShow(b); tipLocked = true; } return; }
  if (!tipBox.contains(e.target)) tipHide();
});
document.addEventListener('scroll', e => { if (!tipBox.hidden && !tipBox.contains(e.target)) tipHide(); }, true);
addEventListener('resize', tipHide);
addEventListener('keydown', e => { if (e.key === 'Escape') tipHide(); });
const micHTML = () => micOn ? '<span class="rdot" aria-hidden="true"></span>Mic: on' : 'Mic: off';
const appTip = () => `<div>Sight-reading trainer for choir singers: load a MIDI score, mute or turn down the other parts, sing your own part into the microphone and get live pitch feedback and a score.</div><div>Source code: <a href="${APP_REPO}" target="_blank" rel="noopener">${APP_REPO.replace('https://', '')}</a></div><div class="mut">Version ${esc(APP_VERSION.startsWith('__') ? 'dev' : APP_VERSION)}</div>`;
const pieceTip = p => (sub(p) ? `<div><b>${esc(sub(p))}</b></div>` : '') + (p.info ? `<div class="info">${esc(p.info)}</div>` : '');

/* ---------- MIDI parser ---------- */
function parseMidi(buf) {
  const d = new DataView(buf); let p = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(d.getUint8(p++)); return s; };
  const vlq = () => { let v = 0, b; do { b = d.getUint8(p++); v = (v << 7) | (b & 127); } while (b & 128); return v; };
  if (str(4) !== 'MThd') throw new Error('Not a MIDI file');
  p = 8; const fmt = d.getUint16(p), nt = d.getUint16(p + 2), div = d.getUint16(p + 4); p += 6;
  if (div & 0x8000) throw new Error('SMPTE timing unsupported');
  const tempos = [], sigs = [], tr = {}, order = [], txt = {}, nm = {}; let endTick = 0;
  for (let t = 0; t < nt; t++) {
    if (str(4) !== 'MTrk') throw new Error('Corrupt MIDI');
    const end = p + 4 + d.getUint32(p); p += 4;
    let tick = 0, rs = 0, name = ''; const on = {};
    while (p < end) {
      tick += vlq(); let s = d.getUint8(p); if (s < 128) s = rs; else p++;
      if (s === 0xFF) {
        const ty = d.getUint8(p++), l = vlq();
        if (ty === 0x51) tempos.push([tick, d.getUint8(p) << 16 | d.getUint8(p + 1) << 8 | d.getUint8(p + 2)]);
        if (ty === 0x58) sigs.push([tick, d.getUint8(p), 2 ** d.getUint8(p + 1)]);
        if (ty >= 1 && ty <= 3) { let x = ''; for (let i = 0; i < l; i++) x += String.fromCharCode(d.getUint8(p + i)); if (ty === 3) { if (!name) name = x; if (!nm[t]) nm[t] = x; } else (txt[t] = txt[t] || []).push(x); }
        p += l;
      } else if (s === 0xF0 || s === 0xF7) { p += vlq(); }
      else {
        rs = s; const ty = s >> 4, ch = s & 15, a = d.getUint8(p++), v = (ty === 12 || ty === 13) ? 0 : d.getUint8(p++);
        if (ch === 9) continue;
        const key = fmt === 0 ? 'c' + ch : 't' + t;
        if (ty === 9 && v > 0) on[ch + ':' + a] = tick;
        else if (ty === 8 || (ty === 9 && v === 0)) {
          const st = on[ch + ':' + a]; if (st === undefined) continue; delete on[ch + ':' + a];
          if (!tr[key]) { tr[key] = { key, name: fmt === 0 ? 'Channel ' + (ch + 1) : (name || 'Track ' + (t + 1)), ticks: [] }; order.push(key); }
          tr[key].ticks.push([st, tick - st, a]); endTick = Math.max(endTick, tick);
        }
      }
    }
  }
  if (!tempos.some(x => x[0] === 0)) tempos.push([0, 500000]);
  if (!sigs.some(x => x[0] === 0)) sigs.push([0, 4, 4]);
  tempos.sort((a, b) => a[0] - b[0]); sigs.sort((a, b) => a[0] - b[0]);
  const segs = []; let sec = 0;
  tempos.forEach((tp, i) => { if (i) sec += (tp[0] - tempos[i - 1][0]) * tempos[i - 1][1] / 1e6 / div; segs.push({ tick: tp[0], sec, us: tp[1] }); });
  const t2s = tk => { let g = segs[0]; for (const s of segs) if (s.tick <= tk) g = s; else break; return g.sec + (tk - g.tick) * g.us / 1e6 / div; };
  const bpmAt = s => { let g = segs[0]; for (const x of segs) if (x.sec <= s) g = x; else break; return 6e7 / g.us; };
  const tracks = order.map(k => {
    const x = tr[k];
    const notes = x.ticks.map(([s, l, m]) => { const t = t2s(s); return { t, d: Math.max(0.05, t2s(s + l) - t), m }; }).sort((a, b) => a.t - b.t);
    return { key: k, name: x.name, notes };
  });
  const sl = []; sigs.forEach(x => { if (sl.length && sl[sl.length - 1][0] === x[0]) sl[sl.length - 1] = x; else sl.push(x); });
  const measures = []; let n = 1;
  sl.forEach((x, i) => {
    const len = x[1] * div * 4 / x[2], stop = i + 1 < sl.length ? sl[i + 1][0] : endTick + len;
    for (let tk = x[0]; tk < stop && len > 0; tk += len) measures.push({ n: n++, t: t2s(tk) });
  });
  const sa = sl.map(x => ({ sec: t2s(x[0]), num: x[1], den: x[2] }));
  const sigAt = s => { let g = sa[0]; for (const x of sa) if (x.sec <= s) g = x; else break; return g; };
  const tmap = segs.map(g => ({ sec: g.sec, bpm: 6e7 / g.us })).filter((g, i, a) => i === a.length - 1 || a[i + 1].sec !== g.sec);
  const ci = Object.keys({ ...nm, ...txt }).map(Number).sort((a, b) => a - b).find(t => fmt === 0 || !tr['t' + t]);
  const info = ci === undefined ? { title: '', texts: [] } : { title: nm[ci] || '', texts: txt[ci] || [] };
  return { tracks, measures, dur: t2s(endTick), bpmAt, sigAt, tmap, info, tempoCount: tempos.length };
}

/* ---------- state ---------- */
const INST = { sine: 'Sine', piano: 'Piano', organ: 'Organ', choir: 'Choir', strings: 'Strings', flute: 'Flute' };
const guess = n => /string|violin|synth|d'bass/i.test(n) ? 'strings' : 'piano';
let pieces = [], cur = null, song = null, tracks = [], mine = null, muted = new Set(), solo = new Set(), inst = {}, ov = {}, vol = {};
let tempo = 1, ctx, master, lfoG, gains = {}, playing = false, startPos = 0, anchorCtx = 0, anchorPos = 0, sched = [], timer = null;
let rec = [], res = null, barStore = {}, lat = 0.12, mvol = 1, an, micOn = false, hist = [], okN = 0, totN = 0, loopId = 0, view = { t0: 0, pps: 50 }, dirty = true;
const LH = 60, RH = 26, TH = 34, Y0 = RH;
try { const sv = localStorage.getItem("lat"); if (sv !== null) lat = +sv; const mv = localStorage.getItem("mvol"); if (mv !== null) mvol = +mv; } catch (e) { }

const audible = k => !muted.has(k) && (!solo.size || solo.has(k));
function refreshMix() {
  app.querySelectorAll('[data-m]').forEach(b => { const k = b.dataset.m; b.className = muted.has(k) ? 'on' : (solo.size && !solo.has(k) ? 'dim' : ''); });
  app.querySelectorAll('[data-s]').forEach(b => { b.className = solo.has(b.dataset.s) ? 'sol' : ''; b.setAttribute('aria-pressed', solo.has(b.dataset.s)); });
  Object.keys(gains).forEach(k => { gains[k].gain.value = audible(k) ? vol[k] : 0; }); dirty = true;
}
const orderTracks = (parsed, meta, all) => {
  const by = Object.fromEntries(parsed.tracks.map(t => [t.key, t])), out = [];
  const add = (t, label, hidden, i) => { const ms = t.notes.map(n => n.m); out.push({ ...t, label, hidden, inst: INST[i] ? i : guess(t.name), lo: Math.min(...ms), hi: Math.max(...ms) }); };
  meta.tracks.forEach(m => { const t = by[m.key]; if (!t) return; delete by[m.key]; if (all || !m.hidden) add(t, m.label, m.hidden, m.instrument); });
  Object.values(by).forEach(t => add(t, t.name, false));
  return out;
};
const loadMidi = async id => parseMidi(await (await fetch(`/api/pieces/${id}/midi`)).arrayBuffer());
const barIdx = s => { const m = song.measures; let lo = 0, hi = m.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (m[mid].t <= s) lo = mid; else hi = mid - 1; } return lo; };

/* ---------- member views ---------- */
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const hay = p => norm([p.title, p.composer, p.date, p.info].join(' '));
const matches = (p, q) => norm(q).split(/\s+/).filter(Boolean).every(w => hay(p).includes(w));
const guessComposer = tx => { const m = tx.map(x => /^\s*(?:by|composer:?)\s+(.+)/i.exec(x)).find(Boolean); return m ? m[1].trim() : ''; };
const guessInfo = tx => tx.filter(x => !/^\s*(?:by|composer:?)\s+/i.test(x)).join('\n');
const sub = p => [p.composer, p.date].filter(Boolean).join(' · ');
async function listView() {
  loopId++; stop(); app.className = 'narrow';
  tipHide(); app.innerHTML = `<h1>Déchiffrage${tipBtn(appTip(), 'About this app')}</h1><div id="l">Loading…</div>`;
  try { pieces = await api('/pieces'); } catch (e) { $('#l').innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  if (!pieces.length) { $('#l').innerHTML = '<p class="mut">No pieces yet. An admin can add one at <a href="#admin">#admin</a>.</p>'; return; }
  $('#l').innerHTML = '<input type="text" id="q" placeholder="Search title, composer, date, info…" autocomplete="off"><div id="rows"></div>';
  const show = () => {
    const r = pieces.filter(p => matches(p, $('#q').value));
    $('#rows').innerHTML = r.length ? r.map(p => `<div class="row"><span class="lb">${esc(p.title)}<div class="mut">${esc(sub(p))}</div></span><button data-id="${p.id}" class="p">Open</button></div>`).join('') : '<p class="mut">No match.</p>';
    app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => openPiece(b.dataset.id));
  };
  $('#q').oninput = show; show();
}
function bindPicker() {
  const inp = $('#ps'), box = $('#pl'); let typed = false, act = 0, list = [];
  const choose = id => { box.classList.add('hide'); inp.blur(); if (id && id !== cur.id) { stop(); openPiece(id); } };
  const draw = () => {
    list = pieces.filter(p => !typed || matches(p, inp.value)); act = Math.min(act, Math.max(0, list.length - 1));
    box.innerHTML = list.length ? list.map((p, i) => `<button data-id="${p.id}" class="${i === act ? 'act' : ''}"><b>${esc(p.title)}</b><div class="mut">${esc(sub(p))}</div></button>`).join('') : '<div class="mut" style="padding:10px">No match</div>';
    box.classList.remove('hide');
    box.querySelectorAll('button').forEach(b => b.onpointerdown = e => { e.preventDefault(); choose(b.dataset.id); });
    const a = box.querySelector('.act'); if (a) a.scrollIntoView({ block: 'nearest' });
  };
  inp.onfocus = () => { typed = false; act = 0; inp.select(); draw(); };
  inp.oninput = () => { typed = true; act = 0; draw(); };
  inp.onblur = () => { box.classList.add('hide'); inp.value = cur.title; };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { act = Math.min(act + 1, list.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { act = Math.max(act - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (list[act]) choose(list[act].id); }
    else if (e.key === 'Escape') inp.blur();
  };
}

async function openPiece(id) {
  tipHide(); cur = pieces.find(p => p.id === id); app.className = 'narrow'; app.innerHTML = '<p>Loading…</p>';
  try { song = await loadMidi(id); } catch (e) { app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  tracks = orderTracks(song, cur, false);
